<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision Tabla Metronome</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --clock-size: 300px;
            --accent-color: #e74c3c;
            --sam-color: #f1c40f;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
        }

        .container {
            text-align: center;
            background: white;
            padding: 2.5rem;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }

        #clock {
            width: var(--clock-size);
            height: var(--clock-size);
            border: 12px solid #333;
            border-radius: 50%;
            position: relative;
            margin: 25px auto;
            background: white;
        }

        #hand {
            width: 4px;
            height: 50%;
            background: var(--accent-color);
            position: absolute;
            bottom: 50%;
            left: calc(50% - 2px);
            transform-origin: bottom center;
            transform: rotate(0deg);
            border-radius: 10px;
            z-index: 2;
        }

        .marker {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 20px;
            background: #333;
            border-radius: 2px;
        }

        .center-dot {
            width: 20px;
            height: 20px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        label { font-size: 0.8rem; font-weight: bold; color: #666; margin-bottom: 8px; }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 1.2rem;
            outline: none;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            text-transform: uppercase;
        }

        #startBtn { background: #27ae60; color: white; margin-bottom: 10px; }
        #stopBtn { background: #c0392b; color: white; }
        button:disabled { opacity: 0.3; }

        /* Sam (Downbeat) visual states */
        .flash { background-color: #fff4d1 !important; border-color: var(--sam-color) !important; }
        .sam-hand { background-color: var(--sam-color) !important; width: 8px !important; left: calc(50% - 4px) !important; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin:0 0 20px 0; color:#222;">Metronome</h2>
    
    <div id="clock">
        <div class="marker"></div>
        <div id="hand"></div>
        <div class="center-dot"></div>
    </div>

    <div class="controls">
        <div class="input-group">
            <label>BPM</label>
            <input type="number" id="bpm" value="120">
        </div>
        <div class="input-group">
            <label>BEATS (Taal)</label>
            <input type="number" id="ts" value="16">
        </div>
    </div>

    <button id="startBtn">START</button>
    <button id="stopBtn" disabled>STOP</button>
</div>

<script>
    let audioCtx = null;
    let nextNoteTime = 0.0;
    let timerID = null;
    let rafID = null;
    let beatCount = 0;
    let isRunning = false;
    let startTime = 0;

    const clock = document.getElementById('clock');
    const hand = document.getElementById('hand');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const bpmInput = document.getElementById('bpm');
    const tsInput = document.getElementById('ts');

    function playClick(time, isSam) {
        const osc = audioCtx.createOscillator();
        const envelope = audioCtx.createGain();

        // Sam is a higher, sharper frequency
        osc.frequency.setValueAtTime(isSam ? 1200 : 600, time);
        osc.type = 'sine';

        envelope.gain.setValueAtTime(0, time);
        envelope.gain.linearRampToValueAtTime(1, time + 0.005);
        envelope.gain.exponentialRampToValueAtTime(0.001, time + 0.1);

        osc.connect(envelope);
        envelope.connect(audioCtx.destination);

        osc.start(time);
        osc.stop(time + 0.1);
    }

    function scheduler() {
        while (nextNoteTime < audioCtx.currentTime + 0.1) {
            const bpm = parseFloat(bpmInput.value) || 120;
            const ts = parseInt(tsInput.value) || 16;
            const secondsPerBeat = 60.0 / bpm;

            const isSam = (beatCount % ts === 0);
            playClick(nextNoteTime, isSam);
            
            nextNoteTime += secondsPerBeat;
            beatCount++;
        }
        timerID = setTimeout(scheduler, 25);
    }

    function updateVisuals() {
        if (!isRunning) return;

        const bpm = parseFloat(bpmInput.value) || 120;
        const ts = parseInt(tsInput.value) || 16;
        const secondsPerCycle = (60.0 / bpm) * ts;
        
        // Exact calculation of rotation relative to the very first beat
        const elapsed = audioCtx.currentTime - startTime;
        const progress = (elapsed % secondsPerCycle) / secondsPerCycle;
        
        // We force degrees to 0 right when a cycle restarts
        const degrees = progress * 360;
        hand.style.transform = `rotate(${degrees}deg)`;

        // Visual flash for the Sam (First 10% of the cycle duration)
        if (progress < 0.1) {
            clock.classList.add('flash');
            hand.classList.add('sam-hand');
        } else {
            clock.classList.remove('flash');
            hand.classList.remove('sam-hand');
        }

        rafID = requestAnimationFrame(updateVisuals);
    }

    startBtn.addEventListener('click', () => {
        if (!audioCtx) audioCtx = new (AudioContext || webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        isRunning = true;
        beatCount = 0;
        
        // SYNC POINT: 
        // We set startTime slightly in the future to give the scheduler 
        // a clean starting line that matches the 12 o'clock position.
        const lookAhead = 0.05; 
        startTime = audioCtx.currentTime + lookAhead;
        nextNoteTime = startTime;

        scheduler();
        updateVisuals();

        startBtn.disabled = true;
        stopBtn.disabled = false;
    });

    stopBtn.addEventListener('click', () => {
        isRunning = false;
        clearTimeout(timerID);
        cancelAnimationFrame(rafID);
        
        hand.style.transform = 'rotate(0deg)';
        clock.classList.remove('flash');
        hand.classList.remove('sam-hand');

        startBtn.disabled = false;
        stopBtn.disabled = true;
    });
</script>

</body>
</html>
